; Estação meteorológica ESP32-C3 — firmware de baixo consumo
;
;   pio run -e esp32c3            para desenvolver (USB serial ativa, bom para calibrar e ver o log)
;   pio run -e esp32c3-lowpower   para a estação em campo (sem USB CDC, que atrapalha o light sleep)

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit BME280 Library@^2.2.4
    bblanchon/ArduinoJson@^7.2.0

[env:esp32c3]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

[env:esp32c3-lowpower]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
