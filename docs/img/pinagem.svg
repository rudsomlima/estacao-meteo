<circle cx="684" cy="362" r="5" fill="#94a3b8"/>
<text x="698" y="360" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" >GPIO9</text>
<text x="698" y="376" font-size="11" fill="#0f172a" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >botão BOOT</text>
