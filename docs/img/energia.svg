<title>Perfis de consumo</title>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="40" y="40" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Arial, sans-serif" >Como a estação gasta energia</text>
<text x="40" y="62" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >Corrente ao longo do tempo (fora de escala vertical). Estimativas de folha de dados, medir em bancada.</text>
<text x="40" y="100" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Arial, sans-serif" >Modo janela (padrão)</text>
<text x="40" y="120" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >Dorme quase o tempo todo; mede o vento por poucos segundos. ≈ 0,20 mA com envio a cada 3 leituras (estimativa).</text>
