<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" role="img" aria-label="Pinagem do ESP32-C3 SuperMini">
<title>Pinagem do ESP32-C3 SuperMini</title>
<rect width="1060" height="700" fill="#ffffff"/>
<text x="40" y="40" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Arial, sans-serif" >Pinagem do ESP32-C3 SuperMini</text>
<text x="40" y="62" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >O que cada pino faz neste projeto (padrão) e o que o chip permite. Confira a serigrafia da sua placa: clones variam.</text>
<rect x="400" y="110" width="260" height="480" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.4" />
