name = "estacao-meteo"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# O mesmo Worker serve o site (web/dist) e a API em /api/*
# Login com Google: o Client ID é público (aparece na página de login). ADMIN_EMAILS são administradores desde o primeiro acesso.
[vars]
GOOGLE_CLIENT_ID = "727995599749-mk2q8n0556ni60vqsienpapsasuqto45.apps.googleusercontent.com"
ADMIN_EMAILS = "rudsomlima@gmail.com"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/__scheduled"]

[[d1_databases]]
binding = "DB"
database_name = "estacao-meteo"
database_id = "f8e8c407-93b3-4469-ad9b-650391daa222"

# Alertas de "estação offline": roda a cada 5 minutos
[triggers]
crons = ["*/5 * * * *"]

# Tempo real: os navegadores recebem um aviso quando a estação envia (WebSocket em /api/live).
# Durable Object com SQLite, que é o único tipo disponível no plano gratuito.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
