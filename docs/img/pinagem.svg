<text x="530" y="235" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="'Helvetica Neue', Arial, sans-serif" >ESP32-C3</text>
<text x="530" y="255" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >RISC-V · Wi-Fi · BLE</text>
<text x="530" y="550" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" >botão BOOT = GPIO9</text>
<text x="530" y="568" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >(segurar ao ligar abre o portal)</text>
