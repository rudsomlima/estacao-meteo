<text x="698" y="173" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >ADC2 · acorda do deep sleep</text>
<path d="M660,200 L684,200" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
