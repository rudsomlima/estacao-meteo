<text x="698" y="414" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" >GPIO10</text>
<text x="698" y="430" font-size="11" fill="#0f172a" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >livre</text>
