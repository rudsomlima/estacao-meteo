; Estação meteorológica ESP32-C3 — firmware de baixo consumo
;
;   pio run -t upload        grava pelo cabo USB (a placa precisa estar acordada: com o cabo plugado ela não dorme)
;   pio device monitor       log e calibração da biruta
;
; Um só firmware serve para a bancada e para o campo. A porta USB só é aberta quando há um computador do outro lado do
; cabo; sem ele (bateria, painel solar, carregador) a placa segue o ciclo de baixo consumo e não gasta nada com a USB.

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/pick_port.py
lib_deps =
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit BME280 Library@^2.2.4
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
