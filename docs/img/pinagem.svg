<text x="698" y="468" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" >GPIO20</text>
<text x="698" y="484" font-size="11" fill="#0f172a" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >UART0 RX (evite)</text>
<path d="M660,524 L684,524" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="684" cy="524" r="5" fill="#94a3b8"/>
<text x="698" y="522" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" >GPIO21</text>
<text x="698" y="538" font-size="11" fill="#0f172a" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >UART0 TX (evite)</text>
<text x="40" y="640" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" font-family="'Helvetica Neue', Arial, sans-serif" >Regras que o site, o servidor e o firmware aplicam ao trocar os pinos:</text>
<text x="40" y="658" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >sem repetir pino · chuva em GPIO0 a 5 (acorda do deep sleep) · bateria em GPIO0 a 4 (ADC1) · nunca 8, 9 (boot), 11 a 17 (flash), 18 e 19 (USB).</text>
<text x="40" y="676" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Helvetica Neue', Arial, sans-serif" >GPIO2, 8 e 9 definem o modo de boot: não os use para sensores com pull-up forte ou que puxem o pino na partida.</text>
</svg>
